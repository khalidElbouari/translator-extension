<!DOCTYPE html>
<html>
<head>
  <title>Darija Translator Sidebar</title>
  <style>
      body {
          font-family: Arial, sans-serif;
          width: 100%;
          padding: 12px;
          margin: 0;
          background: #f9f9f9;
      }
      textarea {
          width: 100%;
          height: 120px;
          padding: 8px;
          border: 1px solid #ccc;
          border-radius: 4px;
      }
      button {
          width: 100%;
          padding: 10px;
          margin-top: 10px;
          background: #007bff;
          color: white;
          border: none;
          border-radius: 4px;
          cursor: pointer;
      }
      button:hover {
          background: #0056b3;
      }
      #result {
          margin-top: 15px;
          font-weight: bold;
          background: white;
          padding: 10px;
          border-radius: 4px;
          min-height: 48px;
      }
  </style>
</head>
<body>
    <h2>English to Darija Translator</h2>

    <textarea id="textInput" placeholder="Enter text here..."></textarea>
    <button id="translateBtn">Translate</button>

    <div id="result">Translation will appear here...</div>

    <script src="side_panel.js"></script>
</body>
</html>
